[project]
name = "gradient-circuit"
version = "0.1.0"
description = "Course data generator for Gradient Circuit (FastF1 -> intermediate JSON)"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.4",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.scripts]
gradient-circuit = "gradient_circuit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradient_circuit"]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
]
