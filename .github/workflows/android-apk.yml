name: Build Android APK

# Design ref: 02_design.md section 6.17.3. Builds an unsigned debug APK
# (no Play Store distribution, no release signing -- design 6.17.3) and
# attaches it to the pushed tag's GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x requires Node >= 22 ("npx cap sync android"
          # fails with "[fatal] The Capacitor CLI requires NodeJS >=22.0.0"
          # on Node 20, found when tagging v0.1.0). pages.yml stays on 20
          # since it never runs the Capacitor CLI.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `variables.gradle` targets compileSdk/targetSdk 36; explicitly
      # installing it (rather than relying on whatever the runner image
      # happens to preinstall) keeps this from silently breaking when the
      # runner's bundled SDK version drifts, and auto-accepts licenses.
      # Must be v4: v3 defaults to `packages: "tools platform-tools"` and the
      # legacy `tools` package no longer exists, so sdkmanager exits 1
      # ("Failed to find package 'tools'"). v4 only installs platform-tools.
      - uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android project
        working-directory: web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --console=plain

      # Manual runs (workflow_dispatch) have no tag to attach a Release to,
      # so keep the APK as a workflow artifact instead.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: app-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: web/android/app/build/outputs/apk/debug/app-debug.apk
